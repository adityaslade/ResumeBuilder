<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Resume Builder | Modern & Clean</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>ResumeBuilder</span>
      </div>
      
      <div class="header-actions">
        <div class="template-box">
          <div class="header-actions">
          <select id="template-selector" class="template-select">
            <option value="modern">Modern Template</option>
            <option value="minimal">Minimalist Template</option>
          </select>
          <div id="user-profile" style="display: none; align-items: center; gap: 1rem;">
            <button id="dashboard-btn" class="btn-ghost" style="color: var(--primary);">My Resumes</button>
            <span id="user-email" style="font-size: 0.85rem; color: var(--text-secondary);"></span>
            <button id="logout-btn" class="btn-ghost" style="color: #ff5252;">Logout</button>
          </div>
          <button id="save-btn" class="btn btn-outline" style="border-color: var(--primary); color: var(--primary);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save
          </button>
          <button id="download-btn" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download
          </button>
        </div>
      </div>
    </header>

    <!-- Dashboard Modal -->
    <div id="dashboard-modal" class="modal-overlay">
      <div class="modal-content" style="max-width: 600px;">
        <button class="modal-close" id="close-dashboard">&times;</button>
        <h2>My Resumes</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 2rem;">Access and manage your saved resume versions.</p>
        
        <div id="resumes-list" class="resumes-grid">
          <!-- Resumes will be loaded here -->
          <div class="loading-spinner">Loading your resumes...</div>
        </div>
      </div>
    </div>

    <!-- Save Modal -->
    <div id="save-modal" class="modal-overlay">
      <div class="modal-content" style="max-width: 400px;">
        <button class="modal-close" id="close-save" onclick="document.getElementById('save-modal').classList.remove('active')">&times;</button>
        <h2>Save Resume</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Give your resume a name to easily find it later.</p>
        
        <div class="input-field">
          <label>Resume Name</label>
          <input type="text" id="resume-title" placeholder="e.g. Senior Developer - Google">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('save-modal').classList.remove('active')">Cancel</button>
          <button id="confirm-save-btn" class="btn btn-primary" style="flex: 2;">Save Version</button>
        </div>
      </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay">
      <div class="modal-content">
        <button class="modal-close" id="close-auth">&times;</button>
        <h2 id="auth-title">Sign In to Download</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Create a free account to download your professional resume.</p>
        
        <form id="auth-form">
          <div class="input-field">
            <label>Email Address</label>
            <input type="email" id="auth-email" required placeholder="example@email.com">
          </div>
          <div class="input-field">
            <label>Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••">
          </div>
          <div id="auth-error" style="color: #ff5252; font-size: 0.85rem; margin-top: 0.5rem; display: none;"></div>
          <button type="submit" id="auth-submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Continue</button>
        </form>
        
        <p style="margin-top: 1.5rem; font-size: 0.85rem; text-align: center;">
          <span id="auth-switch-text">Don't have an account?</span>
          <a href="#" id="auth-switch-link" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign Up</a>
        </p>
      </div>
    </div>

    <div id="app" class="main-layout">
      <!-- Main Editor Area (Accordion Style) -->
      <main class="editor" id="accordion-editor">
        <!-- Accordion items will be injected here -->
      </main>

      <!-- Preview Area -->
      <section class="preview-container">
        <div id="resume-preview" class="resume-paper">
          <!-- Resume preview content will go here -->
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
